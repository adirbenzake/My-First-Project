<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף הראשון שלי</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #text {
    font-size: 12vw;
    font-weight: 900;
    color: #222;
    text-align: center;
    padding: 0 5vw;
    opacity: 0;
    transform: scale(0.2);
  }
  #text.show {
    animation: popIn 0.7s ease-out forwards;
  }
  #text.boom {
    animation: explode 0.25s ease-in forwards;
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.2); }
    70%  { opacity: 1; transform: scale(1.15); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes explode {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.2); }
  }
  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"><div id="text"></div></div>
<canvas id="fx"></canvas>

<script>
const textEl = document.getElementById('text');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function explode() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#007aff', '#af52de'];
  for (let i = 0; i < 160; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 12;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 3 + Math.random() * 6,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.015;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  particles = particles.filter(p => p.life > 0);
  requestAnimationFrame(draw);
}
draw();

function showText(message, next) {
  textEl.className = '';
  void textEl.offsetWidth;
  textEl.textContent = message;
  textEl.classList.add('show');
  setTimeout(() => {
    textEl.classList.remove('show');
    textEl.classList.add('boom');
    explode();
    setTimeout(next, 900);
  }, 1400);
}

function start() {
  showText('שלום עולם!', () => {
    showText('זה הדף הראשון שיצרתי', () => {
      textEl.className = '';
      textEl.textContent = 'לחץ כדי לראות שוב';
      textEl.style.fontSize = '6vw';
      textEl.style.opacity = 1;
      textEl.style.transform = 'scale(1)';
      document.body.addEventListener('click', () => location.reload(), { once: true });
    });
  });
}
start();
</script>
</body>
</html>
