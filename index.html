<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>האתר הראשון שלי</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: manipulation;
  }
  canvas {
    position: fixed;
    inset: 0;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #text {
    font-size: 11vw;
    font-weight: 900;
    color: #fff;
    text-align: center;
    padding: 0 5vw;
    opacity: 0;
    transform: scale(0.2);
    text-shadow: 0 0 20px #7fb8ff, 0 0 50px #9b6bff;
  }
  #text.show {
    animation: popIn 0.9s ease-out forwards;
  }
  #text.boom {
    animation: explode 0.35s ease-in forwards;
  }
  #text.wait {
    font-size: 7vw;
    opacity: 1;
    transform: scale(1);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.1); }
    70%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes explode {
    0%   { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(2.6); filter: blur(8px); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage"><div id="text"></div></div>

<script>
const textEl = document.getElementById('text');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let W, H, stars = [], particles = [], rings = [];
let playMode = false;
let started = false;
const palette = ['#7fb8ff', '#9b6bff', '#ff6bd6', '#6bffea', '#ffd76b', '#ffffff'];

// ---------- צליל ----------
let audioCtx = null;
let master = null;

function initAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      master = audioCtx.createGain();
      master.gain.value = 0.5;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

function tone(freq, start, dur, vol, type, endFreq) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, start);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, start + dur);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g);
  g.connect(master);
  o.start(start);
  o.stop(start + dur + 0.05);
}

// הפיצוץ הגדול: טון נמוך ורך וצלצולים זוהרים
function bigBoom() {
  try {
    const t = audioCtx.currentTime;
    tone(110, t, 1.8, 0.35, 'sine', 35);
    tone(220, t, 1.3, 0.12, 'triangle', 60);
    [1046, 1318, 1568, 2093].forEach((f, i) => {
      tone(f, t + 0.05 + i * 0.08, 1.5, 0.05, 'sine');
    });
  } catch (e) {}
}

// נגיעה במסך: צלצול קטן ורך
function tapChime() {
  try {
    const t = audioCtx.currentTime;
    const notes = [523, 587, 659, 784, 880, 1047, 1175];
    const f = notes[Math.floor(Math.random() * notes.length)];
    tone(f, t, 1.0, 0.12, 'sine');
    tone(f * 2, t, 0.6, 0.04, 'sine');
    tone(90, t, 0.35, 0.1, 'sine', 45);
  } catch (e) {}
}

// ---------- ציור ----------
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 220; i++) {
    stars.push({
      x: (Math.random() - 0.5) * W * 2,
      y: (Math.random() - 0.5) * H * 2,
      z: Math.random() * W
    });
  }
}
resize();
window.addEventListener('resize', resize);

let speed = 4;

function galaxyBurst(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const v = 2 + Math.random() * 11;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * v,
      vy: Math.sin(angle) * v,
      size: 1.5 + Math.random() * 3.5,
      life: 1,
      color: palette[Math.floor(Math.random() * palette.length)],
      spin: (Math.random() - 0.5) * 0.12
    });
  }
  rings.push({ x: x, y: y, r: 5, life: 1 });
}

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(0, 0, W, H);

  // כוכבים שטסים לכיוון המסך
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    s.z -= speed;
    if (s.z <= 1) {
      s.x = (Math.random() - 0.5) * W * 2;
      s.y = (Math.random() - 0.5) * H * 2;
      s.z = W;
    }
    const px = W / 2 + (s.x / s.z) * (W / 2);
    const py = H / 2 + (s.y / s.z) * (W / 2);
    const size = Math.max(0.3, (1 - s.z / W) * 2.6);
    ctx.fillRect(px, py, size, size);
  });
  speed += (4 - speed) * 0.03;

  // טבעות אור
  rings.forEach(r => {
    r.r += 9;
    r.life -= 0.025;
    ctx.globalAlpha = Math.max(r.life, 0);
    ctx.strokeStyle = '#9b6bff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  });
  rings = rings.filter(r => r.life > 0);

  // חלקיקי הפיצוץ הגלקטי
  particles.forEach(p => {
    const cos = Math.cos(p.spin), sin = Math.sin(p.spin);
    const nvx = p.vx * cos - p.vy * sin;
    const nvy = p.vx * sin + p.vy * cos;
    p.vx = nvx * 0.99;
    p.vy = nvy * 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.012;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
  particles = particles.filter(p => p.life > 0);

  requestAnimationFrame(draw);
}
draw();

function showText(message, next) {
  textEl.className = '';
  void textEl.offsetWidth;
  textEl.textContent = message;
  textEl.classList.add('show');
  setTimeout(() => {
    textEl.classList.remove('show');
    textEl.classList.add('boom');
    galaxyBurst(W / 2, H / 2, 220);
    bigBoom();
    speed = 40;
    setTimeout(next, 1000);
  }, 1600);
}

window.addEventListener('pointerdown', (e) => {
  // הנגיעה הראשונה מפעילה את הצליל ומתחילה את המופע
  if (!started) {
    started = true;
    initAudio();
    start();
    return;
  }
  if (!playMode) return;
  initAudio();
  galaxyBurst(e.clientX, e.clientY, 110);
  tapChime();
  speed = 14;
});

function start() {
  showText('שלום עולם!', () => {
    showText('זה האתר הראשון שלי', () => {
      textEl.className = '';
      textEl.style.opacity = 0;
      playMode = true;
    });
  });
}

// מסך פתיחה: דפדפנים דורשים נגיעה אחת לפני שמותר להשמיע צליל
textEl.textContent = 'גע במסך כדי להתחיל';
textEl.className = 'wait';
</script>
</body>
</html>
